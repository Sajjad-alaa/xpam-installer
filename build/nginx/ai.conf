# XPAM ai: AI assistant service.
# Internal endpoints (metrics) are for the service itself and core, never for browsers.
location ^~ /ai/internal/ {
    return 404;
}

# Health checks run inside the container (localhost); each public hit would cost a core request.
location ^~ /ai/health/ {
    return 404;
}

# The address is looked up per request: recreating the service does not need a gateway reload.
location ^~ /ai/ {
    set $xpam_ai http://ai:8083;
    proxy_pass $xpam_ai;
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60;
    proxy_send_timeout 600;
    proxy_read_timeout 600;
    send_timeout 600;
}
