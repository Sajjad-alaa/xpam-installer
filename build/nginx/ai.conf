# XPAM ai (kael): AI assistant service. Legacy /kael/ is a hidden alias.
# Internal endpoints (metrics) are for the service itself and core, never for browsers.
location ^~ /ai/internal/ {
    return 404;
}

location ^~ /kael/internal/ {
    return 404;
}

# The address is looked up per request: recreating the service does not need a gateway reload.
# "set" must come before "rewrite ... break", which stops the remaining rewrite-module directives.
location ^~ /ai/ {
    set $xpam_ai http://kael:8083;
    proxy_pass $xpam_ai;
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60;
    proxy_send_timeout 600;
    proxy_read_timeout 600;
    send_timeout 600;
}

location ^~ /kael/ {
    set $xpam_ai http://kael:8083;
    rewrite ^/kael/(.*)$ /ai/$1 break;
    proxy_pass $xpam_ai;
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60;
    proxy_send_timeout 600;
    proxy_read_timeout 600;
    send_timeout 600;
}
