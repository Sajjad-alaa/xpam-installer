    # XPAM: relative Location headers (nginx sits behind the TLS proxy on an internal port)
    absolute_redirect off;


    # For wecom verify
    location ~* ^/WW_verify_[^.]+\.txt$ {
        root /opt/jumpserver/data/;
    }

    # For acme challenge
    location /.well-known/ {
        root /opt/jumpserver/data/;
    }

    location = /robots.txt {
        default_type text/html;
        add_header Content-Type "text/plain; charset=UTF-8";
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /web/health/ {
        access_log off;
        default_type application/json;
        return 200 '{"status": "ok"}';
    }

    location /player/ {
        try_files $uri / /index.html;
        alias /opt/player/;
    }

    # XPAM: the admin console (web) and the workspace run in their own containers. Their
    # addresses are looked up per request (resolver in nginx.conf), so the gateway starts and
    # keeps serving everything else while one of them is stopped or being replaced.
    location /web/ {
        set $xpam_web http://web:8080;
        proxy_pass $xpam_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5;
        error_page 502 503 504 = @xpam_component_down;
    }

    location /workspace/ {
        set $xpam_workspace http://workspace:8080;
        proxy_pass $xpam_workspace;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5;
        error_page 502 503 504 = @xpam_component_down;
    }

    location @xpam_component_down {
        default_type text/html;
        add_header Retry-After 15 always;
        add_header Cache-Control "no-store" always;
        return 503 '<!doctype html><meta charset="utf-8"><title>XPAM</title><body style="font-family:system-ui,sans-serif;text-align:center;padding-top:18vh;color:#334155"><h2>This part of XPAM is temporarily unavailable</h2><p>It will be back shortly. The other XPAM services keep running.</p></body>';
    }

    location = /web {
        return 301 /web/$is_args$args;
    }

    location = /workspace {
        return 301 /workspace/$is_args$args;
    }

    # Old JumpServer paths: keep bookmarks and links working
    location = /ui {
        return 301 /web/$is_args$args;
    }

    location ^~ /ui/ {
        rewrite ^/ui/(.*)$ /web/$1 permanent;
    }

    location = /luna {
        return 301 /workspace/$is_args$args;
    }

    location ^~ /luna/ {
        rewrite ^/luna/(.*)$ /workspace/$1 permanent;
    }

    # XPAM: desktop client installers are served only from this server (no fallback to
    # jumpserver.org). Put XPAM-<version>-*.exe/.dmg/.deb/.rpm in the mounted folder.
    location ^~ /download/public/ {
        alias /opt/download/public/;
    }

    location /download/ {
        alias /opt/download/;
        try_files $uri @redirect_oss;
    }

    location @redirect_oss {
        rewrite ^/download/(.*)$ https://static.jumpserver.org/download/$1;
    }
# XPAM: workspace page routes renamed (koko -> terminal, lion -> desktop)
location ^~ /workspace/koko/ { rewrite ^/workspace/koko/(.*)$ /workspace/terminal/$1 permanent; }
location ^~ /workspace/lion/ { rewrite ^/workspace/lion/(.*)$ /workspace/desktop/$1 permanent; }
