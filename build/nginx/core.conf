# XPAM core: application pages, API, websockets and media. Static files are served from the
# shared data folder. The address of core is looked up per request (resolver in nginx.conf), like
# every other component: a recreated core is found again without a gateway reload, and the
# gateway never keeps talking to an address that now belongs to another container.
location /static/ {
    root /opt/jumpserver/data/;
    add_header X-Content-Type-Options "nosniff" always;
}

location /private-media/ {
    internal;
    alias /opt/jumpserver/data/media/;
}

location /ws/ {
    set $xpam_core http://core:8080;
    proxy_pass $xpam_core;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location ~ ^/(core|api|media)/ {
    set $xpam_core http://core:8080;
    proxy_pass $xpam_core;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_ignore_client_abort on;
    proxy_connect_timeout 600;
    proxy_send_timeout 600;
    proxy_read_timeout 600;
    send_timeout 6000;
}
