# XPAM facelive: the face recognition WebSocket (/ws/facelive/capture/?token=...&mode=...) used by the
# /workspace/facelive/capture page for face enrolment and face sign-in. More specific than core's /ws/, so it wins.
# The address is looked up per request: recreating the service does not need a gateway reload.
# The file is removed at start when face recognition is off (docker-entrypoint.d/47-xpam-facelive.sh).
location ^~ /ws/facelive/ {
    set $xpam_facelive http://facelive:8085;
    proxy_pass $xpam_facelive;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # (the address that reached the gateway, not one the client claims: the engine limits connections per address.
    # This server is the gateway's inner hop: its own $remote_addr is the gateway itself (127.0.0.1), and the
    # browser's address is the X-Forwarded-For the front server (80/443) set — it replaces what the client sent.)
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_ignore_client_abort on;
    proxy_connect_timeout 10;
    proxy_send_timeout 120;
    proxy_read_timeout 120;
    send_timeout 120;
}
