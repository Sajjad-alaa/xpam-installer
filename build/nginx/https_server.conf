# XPAM gateway: the public HTTP and HTTPS servers. Both hand every request to the internal server on port 51980
# (conf.d/default.conf), which routes it to the services. The start script (docker-entrypoint.d/40-xpam-init.sh)
# fills in the server names, the HTTPS redirect, IPv6, the certificate and the rate limits.
upstream http_server {
  ip_hash;
  server localhost:51980;
}

# Limits per client: the address that connected (this server is the first hop), or — behind a trusted load balancer
# (USE_LB=0) — the address the balancer recorded last in X-Forwarded-For (never one a client wrote itself). The start
# script picks the key (XPAM_CLIENT_KEY lines) and the values (RATE_LIMIT_*; RATE_LIMIT_ENABLED=0 removes them).
map $http_x_forwarded_for $xpam_forwarded_client {
  "~(?<xpam_last>[^,\s]+)\s*$" $xpam_last;
  default $remote_addr;
}
map $request_method $xpam_signin_client {
  POST $binary_remote_addr;  # XPAM_CLIENT_KEY
  default "";
}
# every request, and the connections open at a time: a flood, not a busy office behind one address
limit_req_zone $binary_remote_addr zone=xpam_requests:20m rate=100r/s;  # XPAM_CLIENT_KEY XPAM_RATE_REQUESTS
limit_conn_zone $binary_remote_addr zone=xpam_conn:10m;  # XPAM_CLIENT_KEY
# sign-in, MFA, password reset and token requests (POST only: loading the pages is not limited)
limit_req_zone $xpam_signin_client zone=xpam_signin:10m rate=5r/s;  # XPAM_RATE_SIGNIN
limit_req_status 429;
limit_conn_status 429;

server {
  listen 80;
  # listen [::]:80;
  # server_name _;
  # HTTPS_REDIRECT

  client_max_body_size 5000m;

  location ~ ^/(core/auth/(login|password|profile/otp|profile/mfa|oauth2-provider/token)|api/v1/authentication/(auth|tokens|mfa|password|confirm-oauth|custom-sso)/) {
    limit_req zone=xpam_signin burst=30 nodelay;  # XPAM_LIMIT
    limit_req zone=xpam_requests burst=400 nodelay;  # XPAM_LIMIT
    limit_conn xpam_conn 400;  # XPAM_LIMIT
    proxy_pass http://http_server;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_ignore_client_abort on;
    proxy_connect_timeout 600;
    proxy_send_timeout 600;
    proxy_read_timeout 600;
    send_timeout 6000;
  }

  location / {
    limit_req zone=xpam_requests burst=400 nodelay;  # XPAM_LIMIT
    limit_conn xpam_conn 400;  # XPAM_LIMIT
    proxy_pass http://http_server;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    # (this server is the first hop unless USE_LB=0 says a trusted proxy is in front: the start script sets it)
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_ignore_client_abort on;
    proxy_connect_timeout 600;
    proxy_send_timeout 600;
    proxy_read_timeout 600;
    send_timeout 6000;
  }
}

server {
  listen 443 ssl;
  http2 on;
  # listen [::]:443 ssl;
  # server_name _;
  server_tokens off;
  add_header Strict-Transport-Security "max-age=31536000" always;
  ssl_certificate cert/server.crt;
  ssl_certificate_key cert/server.key;
  ssl_session_timeout 1d;
  ssl_session_cache shared:MozSSL:10m;
  ssl_session_tickets off;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;

  client_max_body_size 5000m;

  location ~ ^/(core/auth/(login|password|profile/otp|profile/mfa|oauth2-provider/token)|api/v1/authentication/(auth|tokens|mfa|password|confirm-oauth|custom-sso)/) {
    limit_req zone=xpam_signin burst=30 nodelay;  # XPAM_LIMIT
    limit_req zone=xpam_requests burst=400 nodelay;  # XPAM_LIMIT
    limit_conn xpam_conn 400;  # XPAM_LIMIT
    proxy_pass http://http_server;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_ignore_client_abort on;
    proxy_connect_timeout 600;
    proxy_send_timeout 600;
    proxy_read_timeout 600;
    send_timeout 6000;
  }

  location / {
    limit_req zone=xpam_requests burst=400 nodelay;  # XPAM_LIMIT
    limit_conn xpam_conn 400;  # XPAM_LIMIT
    proxy_pass http://http_server;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    # (this server is the first hop unless USE_LB=0 says a trusted proxy is in front: the start script sets it)
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_ignore_client_abort on;
    proxy_connect_timeout 600;
    proxy_send_timeout 600;
    proxy_read_timeout 600;
    send_timeout 6000;
  }
}
