location /static/img/interface/ {
    # Uploads live outside data/static (wiped by collectstatic -c on every core start)
    alias /opt/jumpserver/data/interface/;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
    add_header X-Frame-Options "DENY" always;
    types {
        image/png png;
        image/jpeg jpg jpeg;
        image/gif gif;
        image/x-icon ico;
        image/webp webp;
    }
    default_type application/octet-stream;
}
