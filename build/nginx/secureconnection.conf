# XPAM secureconnection (koko): terminal, SFTP, monitoring and remote desktop (/secureconnection/desktop/).
# The legacy /koko/ and /koko/lion/ prefixes stay as hidden aliases for older clients and open sessions.
# The address is looked up per request: recreating the service does not need a gateway reload.
# "set" must come before "rewrite ... break", which stops the remaining rewrite-module directives.
location ^~ /secureconnection/ {
    set $xpam_sc http://koko:5000;
    proxy_pass $xpam_sc;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_ignore_client_abort on;
    proxy_connect_timeout 600;
    proxy_send_timeout 600;
    proxy_read_timeout 600;
    send_timeout 6000;
}
location ^~ /koko/lion/ {
    set $xpam_sc http://koko:5000;
    rewrite ^/koko/lion/(.*)$ /secureconnection/desktop/$1 break;
    proxy_pass $xpam_sc;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_ignore_client_abort on;
    proxy_connect_timeout 600;
    proxy_send_timeout 600;
    proxy_read_timeout 600;
    send_timeout 6000;
}
location ^~ /koko/ {
    set $xpam_sc http://koko:5000;
    rewrite ^/koko/(.*)$ /secureconnection/$1 break;
    proxy_pass $xpam_sc;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_ignore_client_abort on;
    proxy_connect_timeout 600;
    proxy_send_timeout 600;
    proxy_read_timeout 600;
    send_timeout 6000;
}
