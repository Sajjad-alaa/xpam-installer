# XPAM web: serves only the admin console files under /web/. The gateway forwards /web/ here.
# Port 8090 is used by no other XPAM service, and anything outside /web/ is refused, so this
# container can never answer for another component by mistake.
server {
    listen 8090;
    absolute_redirect off;
    access_log off;
    # (the *.gz copies made when the image was built, for browsers that accept gzip)
    gzip_static on;

    location = /health {
        default_type application/json;
        return 200 '{"status": "ok", "component": "web"}';
    }

    # The file if it exists, otherwise the app's index.html (single-page app routes). index.html is checked
    # on every load (no-cache), so a new release is picked up at once.
    location /web/ {
        root /opt;
        add_header Cache-Control "no-cache" always;
        try_files $uri /web/index.html;
    }

    # Built files carry a hash of their content in their name: a new release has new names, so browsers may keep
    # them for a year without asking again (repeat visits download nothing but index.html)
    location /web/assets/ {
        root /opt;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
