# XPAM web: serves only the admin console files under /web/. The gateway forwards /web/ here.
server {
    listen 8080;
    absolute_redirect off;
    access_log off;

    location = /health {
        default_type application/json;
        return 200 '{"status": "ok"}';
    }

    # Same lookup order as before the split: the file, then the app's index.html (single-page app)
    location / {
        rewrite ^/(.*)$ /web/$1 last;
    }

    location /web/ {
        try_files $uri / /index.html;
        alias /opt/web/;
    }
}
