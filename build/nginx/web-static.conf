# XPAM web: serves only the admin console files under /web/. The gateway forwards /web/ here.
# Port 8090 is used by no other XPAM service, and anything outside /web/ is refused, so this
# container can never answer for another component by mistake.
server {
    listen 8090;
    absolute_redirect off;
    access_log off;

    location = /health {
        default_type application/json;
        return 200 '{"status": "ok", "component": "web"}';
    }

    # The file if it exists, otherwise the app's index.html (single-page app routes)
    location /web/ {
        root /opt;
        try_files $uri /web/index.html;
    }

    location / {
        return 404;
    }
}
