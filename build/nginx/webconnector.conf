# XPAM webconnector: database web connector.
# The address is looked up per request: recreating the service does not need a gateway reload.
# Health checks run inside the container (localhost)
location ^~ /webconnector/healthy {
    return 404;
}

location ^~ /webconnector/ {
    set $xpam_wc http://webconnector:8082;
    proxy_pass $xpam_wc;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_ignore_client_abort on;
    proxy_connect_timeout 600;
    proxy_send_timeout 600;
    proxy_read_timeout 600;
    send_timeout 6000;
}
