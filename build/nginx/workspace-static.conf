# XPAM workspace: serves only the workspace files under /workspace/. The gateway forwards /workspace/ here.
# Port 8090 is used by no other XPAM service, and anything outside /workspace/ is refused, so this
# container can never answer for another component by mistake.
server {
    listen 8090;
    absolute_redirect off;
    access_log off;
    # (the *.gz copies made when the image was built, for browsers that accept gzip)
    gzip_static on;

    location = /health {
        default_type application/json;
        return 200 '{"status": "ok", "component": "workspace"}';
    }

    # The file if it exists, otherwise the app's index.html (single-page app routes). index.html is checked
    # on every load (no-cache), so a new release is picked up at once.
    location /workspace/ {
        root /opt;
        add_header Cache-Control "no-cache" always;
        try_files $uri /workspace/index.html;
    }

    # Built files carry a hash of their content in their name: a new release has new names, so browsers may keep
    # them for a year without asking again (repeat visits download nothing but index.html)
    location /workspace/_nuxt/ {
        root /opt;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # (except Nuxt's build manifest: same name every release, it tells the page a new version exists)
    location /workspace/_nuxt/builds/ {
        root /opt;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
