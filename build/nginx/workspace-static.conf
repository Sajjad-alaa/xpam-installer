# XPAM workspace: serves only the workspace files under /workspace/. The gateway forwards /workspace/ here.
server {
    listen 8080;
    absolute_redirect off;
    access_log off;

    location = /health {
        default_type application/json;
        return 200 '{"status": "ok"}';
    }

    # Same lookup order as before the split: the file, then the app's index.html (single-page app)
    location / {
        rewrite ^/(.*)$ /workspace/$1 last;
    }

    location /workspace/ {
        try_files $uri / /index.html;
        alias /opt/workspace/;
    }
}
