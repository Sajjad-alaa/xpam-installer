# XPAM runner: the Ansible settings of every job (a job cannot bring its own: ANSIBLE_CONFIG points here)
[defaults]
forks             = 20
host_key_checking = False
library           = /opt/core/apps/libs/ansible/modules
timeout           = 65
retry_files_enabled = False
[ssh_connection]
ssh_args = -o ControlMaster=no -o ControlPersist=no -o UserKnownHostsFile=/dev/null
pipelining = True
