services:
  chen:
    image: ${XPAM_NAMESPACE:-xpam}/webconnector:${XPAM_VERSION:-${XPAM_DEFAULT_VERSION:-v5.0.0}}
    container_name: jms_chen
    hostname: jms_chen
    ulimits:
      core: 0
    restart: always
    env_file:
      - ${CONFIG_SAFE_FILE}
    volumes:
      - ${VOLUME_DIR}/chen/data:/opt/chen/data
      - ${CONFIG_DIR}/certs:/opt/chen/data/certs
    healthcheck:
      test: "check http://localhost:8082/webconnector/healthy"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - net