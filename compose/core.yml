services:
  core:
    image: ${XPAM_NAMESPACE:-xpam}/core:${XPAM_VERSION:-${XPAM_DEFAULT_VERSION:-v5.1.20}}
    pull_policy: never  # XPAM images come from xpamctl (never Docker Hub)
    container_name: xpam_core
    hostname: xpam_core
    ulimits:
      core: 0
    restart: always
    command: start web
    env_file:
      - ${CONFIG_FILE}
    environment:
      TIME_ZONE: ${TZ:-UTC}
    volumes:
      - ${CONFIG_DIR}/certs:/opt/jumpserver/data/certs
      - ${VOLUME_DIR}/core/data:/opt/jumpserver/data
    healthcheck:
      test: "check http://localhost:8080/api/health/"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
      start_interval: 2s  # (health known within ~2 s of a start: failover, restarts)
    networks:
      - net
    extra_hosts:
      - "host.docker.internal:host-gateway"
