services:
  # The front door: ports 80/443, certificates and routing. It holds no application files.
  gateway:
    image: ${XPAM_NAMESPACE:-xpam}/gateway:${XPAM_VERSION:-${XPAM_DEFAULT_VERSION:-v5.1.39}}
    pull_policy: never  # XPAM images come from xpamctl (never Docker Hub)
    container_name: xpam_gateway
    hostname: xpam_gateway
    ulimits:
      core: 0
      memlock:
        soft: -1
        hard: -1
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-UTC}
      HTTP_PORT: 80
      USE_LB: ${USE_LB:-1}
      USE_IPV6: ${USE_IPV6:-0}
      USE_XPACK: ${USE_XPACK:-0}
      GZIP: ${GZIP:-on}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-4096m}
      CORE_ENABLED: ${CORE_ENABLED:-1}
      SECURECONNECTION_ENABLED: ${SECURECONNECTION_ENABLED:-${KOKO_ENABLED:-1}}
      WEBCONNECTOR_ENABLED: ${WEBCONNECTOR_ENABLED:-${CHEN_ENABLED:-1}}
      AI_ENABLED: ${AI_ENABLED:-${KAEL_ENABLED:-1}}
      # the /ws/facelive/ route: on when face recognition is on (the same rule as scripts/gists/service.sh)
      FACELIVE_ENABLED: ${FACELIVE_ENABLED:-${FACE_RECOGNITION_ENABLED:-0}}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
    volumes:
      # read only, and only what nginx serves (not ansible/celery runtime data or certificates)
      - ${VOLUME_DIR}/core/data/static:/opt/core/data/static:ro
      - ${VOLUME_DIR}/core/data/media:/opt/core/data/media:ro
      - ${VOLUME_DIR}/core/data/interface:/opt/core/data/interface:ro
      - ${VOLUME_DIR}/core/data/.well-known:/opt/core/data/.well-known:ro
      - ${VOLUME_DIR}/nginx/data/logs:/var/log/nginx
      - ${CONFIG_DIR}/nginx/interface_security.conf:/etc/nginx/includes/interface_security.conf:ro
      - ${VOLUME_DIR}/web/download:/opt/download/public:ro
      # Installers that publishing hosts fetch from /download/applets/ (for example XPAM WebLite)
      - ${VOLUME_DIR}/web/applets:/opt/download/applets:ro
    healthcheck:
      test: "check http://localhost:51980/web/health/"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - net
    extra_hosts:
      - "host.docker.internal:host-gateway"
