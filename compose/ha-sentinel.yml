services:
  # XPAM high availability, active-active: Redis Sentinel on every server. A majority of the Sentinels picks
  # the main Redis and moves it when its server fails; XPAM's containers on every server ask them where it is.
  # Only TLS (26380, client certificate of the cluster CA), to the Sentinels and to Redis (6380). The Sentinel
  # runs on a copy of its configuration in memory (/tmp is a tmpfs) with the passwords; its state (master,
  # epoch, known Sentinels) is kept on disk every few seconds without them, so it survives a restart and no
  # secret reaches the disk. It runs as the redis user.
  sentinel:
    image: redis:7.4.10-bookworm
    pull_policy: never
    container_name: xpam_sentinel
    restart: always
    tmpfs:
      - /tmp:mode=1777
    command:
      - sh
      - -c
      - >-
        umask 077 &&
        mkdir -p /tmp/xpam-tls /data/sentinel &&
        cp /etc/xpam-ha/ca.crt /etc/xpam-ha/node.crt /etc/xpam-ha/node.key /tmp/xpam-tls/ &&
        s=/data/sentinel/state.conf && f=/tmp/sentinel.conf &&
        if [ -s "$$s" ]; then cp "$$s" "$$f"; else
          printf 'port 0\ntls-port 26380\ntls-cert-file /tmp/xpam-tls/node.crt\ntls-key-file /tmp/xpam-tls/node.key\ntls-ca-cert-file /tmp/xpam-tls/ca.crt\ntls-auth-clients yes\ntls-replication yes\nsentinel resolve-hostnames no\nsentinel announce-ip %s\nsentinel announce-port 26380\nsentinel monitor xpam %s 6380 %s\nsentinel down-after-milliseconds xpam 5000\nsentinel failover-timeout xpam 30000\nsentinel parallel-syncs xpam 1\n' "$$HA_NODE_IP" "$$HA_REDIS_MASTER" "$$HA_SENTINEL_QUORUM" > "$$f";
        fi &&
        printf 'requirepass "%s"\nsentinel sentinel-pass "%s"\nsentinel auth-pass xpam "%s"\n' "$$REDIS_PASSWORD" "$$REDIS_PASSWORD" "$$REDIS_PASSWORD" >> "$$f" &&
        chown -R redis:redis /tmp/xpam-tls /data/sentinel "$$f" &&
        { ( while sleep 5; do grep -v -e '^requirepass ' -e '^masterauth ' -e '^user ' -e '^sentinel auth-pass ' -e '^sentinel sentinel-pass ' "$$f" > "$$s.new" 2>/dev/null && mv -f "$$s.new" "$$s"; done ) & } &&
        exec docker-entrypoint.sh redis-server "$$f" --sentinel
    environment:
      TZ: ${TZ:-UTC}
      REDIS_PASSWORD: $REDIS_PASSWORD
      HA_NODE_IP: ${HA_NODE_IP}
      HA_REDIS_MASTER: ${HA_REDIS_MASTER}
      HA_SENTINEL_QUORUM: ${HA_SENTINEL_QUORUM:-2}
    ports:
      - "${HA_NODE_IP}:26380:26380"
    volumes:
      - ${VOLUME_DIR}/redis/sentinel:/data/sentinel
      - ${CONFIG_DIR}/ha/certs:/etc/xpam-ha:ro
    networks:
      - net
