services:
  core:
    image: ${XPAM_NAMESPACE:-xpam}/core:${XPAM_VERSION:-${XPAM_DEFAULT_VERSION:-v5.1.17}}
    pull_policy: never  # XPAM images come from xpamctl (never Docker Hub)
    container_name: xpam_core
    hostname: xpam_core
    command: sleep
    env_file:
      - ${CONFIG_FILE}
    volumes:
      - ${CONFIG_DIR}/certs:/opt/jumpserver/data/certs
      - ${VOLUME_DIR}/core/data:/opt/jumpserver/data
    networks:
      - net
