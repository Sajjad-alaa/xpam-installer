services:
  kael:
    image: ${XPAM_NAMESPACE:-xpam}/ai:${XPAM_VERSION:-${XPAM_DEFAULT_VERSION:-v5.1.17}}
    pull_policy: never  # XPAM images come from xpamctl (never Docker Hub)
    container_name: xpam_ai
    hostname: xpam_ai
    ulimits:
      core: 0
    restart: always
    env_file:
      - ${CONFIG_SAFE_FILE}
    environment:
      # (XPAM: config-safe.txt has no secrets; the ones this service uses, by name)
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN}
      CHAT_AI_API_KEY: ${CHAT_AI_API_KEY:-}
      PLATFORM_GATEWAY_ENABLED: "true"
      PLATFORM_DELEGATION_KEY: ${CHAT_AI_DELEGATION_SECRET}
    volumes:
      - ${VOLUME_DIR}/kael/data:/opt/kael/data
    healthcheck:
      test: "check http://localhost:8083/ai/health/ready"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - net
