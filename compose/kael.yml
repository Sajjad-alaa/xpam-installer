services:
  kael:
    image: ${XPAM_NAMESPACE:-xpam}/ai:${XPAM_VERSION:-${XPAM_DEFAULT_VERSION:-v5.1.4}}
    container_name: xpam_ai
    hostname: xpam_ai
    ulimits:
      core: 0
    restart: always
    env_file:
      - ${CONFIG_SAFE_FILE}
    environment:
      PLATFORM_GATEWAY_ENABLED: "true"
      PLATFORM_DELEGATION_KEY: ${CHAT_AI_DELEGATION_SECRET}
    volumes:
      - ${VOLUME_DIR}/kael/data:/opt/kael/data
    healthcheck:
      test: "check http://localhost:8083/ai/health/ready"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - net
