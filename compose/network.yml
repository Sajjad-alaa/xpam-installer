networks:
  net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${DOCKER_SUBNET}
  # XPAM: the Remote browser and the remote-desktop service only. Pages shown in the browser can
  # reach web assets (outbound) but none of XPAM's own containers (core, redis, postgresql, ai...).
  browser:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${BROWSER_SUBNET:-192.168.251.0/24}
  # XPAM: the runner (jobs users write) and the worker's door to it. Jobs reach the servers they run on, none of
  # XPAM's own containers.
  runner:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${RUNNER_SUBNET:-192.168.252.0/24}
