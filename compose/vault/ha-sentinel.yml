# XPAM: secrets from HashiCorp Vault — the Sentinel uses Redis's password, read from Vault into memory at boot
# (/run/xpam/secrets/redis); never part of its settings (docker inspect) nor of config.txt.
services:
  sentinel:
    entrypoint: ["/bin/sh", "-c", "while [ ! -s /run/xpam-secrets/env ]; do sleep 2; done; set -a; . /run/xpam-secrets/env; set +a; exec \"$$@\"", "xpam-secrets", "docker-entrypoint.sh"]
    volumes:
      - /run/xpam/secrets/redis:/run/xpam-secrets:ro
