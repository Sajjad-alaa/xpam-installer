services:
  video-worker:
    image: ${NAMESPACE:-jumpserver}/video-worker:${VERSION}
    container_name: xpam_video-worker
    hostname: xpam_video-worker
    cpus: 2
    ulimits:
      core: 0
    restart: always
    env_file:
      - ${CONFIG_SAFE_FILE}
    environment:
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN}
    volumes:
      - ${VOLUME_DIR}/video-worker/data:/opt/video-worker/data
    healthcheck:
      test: "curl -fsS http://localhost:9000/video-worker/health/ >/dev/null"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - net
