services:
  # Admin console: static files only. The gateway forwards /web/ here; nothing else depends on it.
  web:
    image: ${XPAM_NAMESPACE:-xpam}/web:${XPAM_VERSION:-${XPAM_DEFAULT_VERSION:-v5.0.0}}
    container_name: xpam_web
    hostname: xpam_web
    ulimits:
      core: 0
    restart: always
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      test: "check http://localhost:8090/health"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - net
