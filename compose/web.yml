services:
  # Admin console: static files only. The gateway forwards /web/ here; nothing else depends on it.
  web:
    image: ${XPAM_NAMESPACE:-xpam}/web:${XPAM_VERSION:-${XPAM_DEFAULT_VERSION:-v5.1.4}}
    container_name: xpam_web
    hostname: xpam_web
    ulimits:
      core: 0
    restart: always
    # Static files only: no writable root file system, no extra privileges
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/log/nginx
      - /var/run
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-UTC}
    healthcheck:
      test: "check http://localhost:8090/health"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - net
