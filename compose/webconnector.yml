services:
  webconnector:
    image: ${XPAM_NAMESPACE:-xpam}/webconnector:${XPAM_VERSION:-${XPAM_DEFAULT_VERSION:-v5.1.39}}
    pull_policy: never  # XPAM images come from xpamctl (never Docker Hub)
    container_name: xpam_webconnector
    hostname: xpam_webconnector
    ulimits:
      core: 0
    restart: always
    security_opt:
      - no-new-privileges:true
    env_file:
      - ${CONFIG_SAFE_FILE}
    environment:
      # (XPAM: config-safe.txt has no secrets; the ones this service uses, by name)
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN}
    volumes:
      - ${VOLUME_DIR}/chen/data:/opt/webconnector/data
      - ${CONFIG_DIR}/certs:/opt/webconnector/data/certs:ro
    healthcheck:
      test: "check http://localhost:8082/webconnector/healthy"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - net