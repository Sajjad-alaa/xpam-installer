services:
  # The background worker: scheduled jobs, account automation, notifications. Same image as core.
  worker:
    image: ${XPAM_NAMESPACE:-xpam}/core:${XPAM_VERSION:-${XPAM_DEFAULT_VERSION:-v5.1.39}}
    pull_policy: never  # XPAM images come from xpamctl (never Docker Hub)
    container_name: xpam_worker
    hostname: xpam_worker
    ulimits:
      core: 0
    restart: always
    # Off by default. WORKER_PRIVILEGED=true (or the older CELERY_PRIVILEGED) turns it back on.
    privileged: ${WORKER_PRIVILEGED:-${CELERY_PRIVILEGED:-false}}
    security_opt:
      - no-new-privileges:true
    command: start task
    env_file:
      - ${CONFIG_FILE}
    environment:
      LC_ALL: C.UTF-8
    volumes:
      - ${CONFIG_DIR}/certs:/opt/core/data/certs:ro
      - ${VOLUME_DIR}/core/data:/opt/core/data
    healthcheck:
      test: "bash /opt/core/utils/check_worker.sh"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - net
