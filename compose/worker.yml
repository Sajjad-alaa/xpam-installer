services:
  # The background worker: scheduled jobs, account automation, notifications. Same image as core.
  worker:
    image: ${XPAM_NAMESPACE:-xpam}/core:${XPAM_VERSION:-${XPAM_DEFAULT_VERSION:-v5.1.9}}
    container_name: xpam_worker
    hostname: xpam_worker
    ulimits:
      core: 0
    restart: always
    # Off by default. WORKER_PRIVILEGED=true (or the older CELERY_PRIVILEGED) turns it back on.
    privileged: ${WORKER_PRIVILEGED:-${CELERY_PRIVILEGED:-false}}
    command: start task
    env_file:
      - ${CONFIG_FILE}
    environment:
      LC_ALL: C.UTF-8
    volumes:
      - ${CONFIG_DIR}/certs:/opt/jumpserver/data/certs
      - ${VOLUME_DIR}/core/data:/opt/jumpserver/data
    healthcheck:
      test: "bash /opt/jumpserver/utils/check_worker.sh"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - net
